<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AllThingsSEO — a beginner-friendly SEO education and training app with interactive lessons, customizable templates, checklists, and tools for marketers, founders, and product teams."
    />
    <meta name="theme-color" content="#4DB6AC" />
    <title>AllThingsSEO — Learn, Practice &amp; Ship Better SEO</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%234DB6AC'/%3E%3Ctext x='50%25' y='58%25' font-family='Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- ============ APP SHELL ============ -->
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="app-header">
      <div class="container header-inner">
        <a href="#/" class="brand" aria-label="AllThingsSEO home">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span class="brand-text">
            AllThings<span class="brand-accent">SEO</span>
          </span>
        </a>

        <button
          class="nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          <span></span><span></span><span></span>
        </button>

        <nav id="primary-nav" class="primary-nav" aria-label="Primary">
          <a href="#/" data-route="/">Home</a>
          <a href="#/learn" data-route="/learn">Learn</a>
          <a href="#/templates" data-route="/templates">Templates</a>
          <a href="#/checklists" data-route="/checklists">Checklists</a>
          <a href="#/tools" data-route="/tools">Tools</a>
          <a href="#/glossary" data-route="/glossary">Glossary</a>
        </nav>
      </div>
    </header>

    <main id="main" class="app-main">
      <div id="view" class="container view" aria-live="polite"></div>
    </main>

    <footer class="app-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <span class="brand-mark small" aria-hidden="true">S</span>
          <span>AllThings<span class="brand-accent">SEO</span></span>
        </div>
        <p class="footer-tag">
          Practical SEO education for non-SEO people — learn, practice, ship.
        </p>
        <p class="footer-meta">
          Built as an open learning companion · v1.0
        </p>
      </div>
    </footer>

    <!-- ============ TOAST ============ -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- ============ SCRIPTS ============ -->
    <script src="js/data-courses.js"></script>
    <script src="js/data-templates.js"></script>
    <script src="js/data-checklists.js"></script>
    <script src="js/data-glossary.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
